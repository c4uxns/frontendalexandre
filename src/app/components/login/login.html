<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-card">
    <h2>Acessar Conta</h2>
    
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" formControlName="email" placeholder="seu@email.com">
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" formControlName="password" placeholder="••••••••••••••••">
    </div>

    <!-- Botão principal de envio -->
    <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
  </form>
</div>
